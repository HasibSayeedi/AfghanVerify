name: afghanverify

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - afghanverify-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: src/AfghanVerify.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=AfghanVerifyDb;User Id=sa;Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Issuer: AfghanVerify
      Jwt__Audience: AfghanVerify.Web
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the root .env file}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-30}
      Cryptography__SigningKey: ${CRYPTOGRAPHY_SIGNING_KEY:?Set CRYPTOGRAPHY_SIGNING_KEY in the root .env file}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
      Email__Host: ${SMTP_HOST:?Set SMTP_HOST in the root .env file}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in the root .env file}
      Email__FromName: ${SMTP_FROM_NAME:-Afghan Verify}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      PasswordRecovery__FrontendBaseUrl: ${PUBLIC_FRONTEND_URL:-http://localhost:8080}
      PasswordRecovery__TokenLifetimeMinutes: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      DataProtection__KeysPath: /var/afghanverify-keys
    volumes:
      - data-protection-keys:/var/afghanverify-keys
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-5081}:8080"
    networks:
      - afghanverify-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - afghanverify-network

volumes:
  sqlserver-data:
  data-protection-keys:

networks:
  afghanverify-network:
    driver: bridge
